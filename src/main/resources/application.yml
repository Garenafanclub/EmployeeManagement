spring:
  application:
    name: employee-management-service

  # ── Database ───────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mayank}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── Redis ───────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

# ── API ──────────────────────────────────────────────────────────
api:
  version: /api/v1

# ── JWT ──────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# ── Server ───────────────────────────────────────────────────────
server:
  port: 8081
