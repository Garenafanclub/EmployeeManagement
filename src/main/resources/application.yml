spring:
  application:
    name: employee-management-service

  datasource:
    url: jdbc:postgresql://localhost:5432/mayank
    username: postgres
    password: "00000"
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

api:
  version: api/v1

server:
  port: 8081